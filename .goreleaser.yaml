# GoReleaser config for dtui.
# Docs: https://goreleaser.com
version: 2

project_name: dtui

before:
  hooks:
    # Only download — never `go mod tidy`, which could dirty the tree and make
    # GoReleaser refuse to run.
    - go mod download

builds:
  - id: dtui
    binary: dtui
    main: .
    # The TUI is pure Go; a CGO-free build cross-compiles cleanly.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Match `make build`: stamp both dtui's version and the dtctl
    # pkg/version vars that consumed dtctl packages read.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/dynatrace-oss/dtctl/pkg/version.Version={{ .Version }}
      - -X github.com/dynatrace-oss/dtctl/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/dynatrace-oss/dtctl/pkg/version.Date={{ .Date }}

archives:
  - id: dtui
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

signs:
  # cosign v3 signs into a single Sigstore bundle. Verify with:
  # cosign verify-blob --bundle checksums.txt.sigstore.json ... checksums.txt
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive
    cmd: syft
    args:
      - "${artifact}"
      - "--output"
      - "spdx-json=${document}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes are written by release-please (GitHub Release body) and
# GoReleaser only attaches artifacts to that existing release, so it must not
# generate a changelog or overwrite the notes.
changelog:
  disable: true

release:
  mode: keep-existing
