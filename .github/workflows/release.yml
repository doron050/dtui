name: release

# Releases are driven by release-please but triggered MANUALLY: nothing happens
# on ordinary merges to main. Run this workflow from the Actions tab ("Run
# workflow"). Each run does ONE of two things, depending on repo state:
#
#   1. Releasable commits exist since the last release and no release PR has
#      been merged -> release-please opens/updates the release PR (manifest
#      bump). Review it.
#   2. The release PR was merged -> run this workflow AGAIN; release-please
#      creates the git tag and GitHub Release (with notes), and the gated
#      GoReleaser job builds, signs and attaches the artifacts.
#
# So a full release is: dispatch -> merge the release PR -> dispatch again.
#
# release-please tags with GITHUB_TOKEN, which does not trigger `on: push: tags`
# workflows, so GoReleaser runs as a gated job in this same workflow.
#
# RECOVERY: if GoReleaser fails after the release was created (tag exists, no
# artifacts), fix the cause on main and re-dispatch with `republish_tag` set to
# that tag. It skips release-please, checks out the tag unchanged and builds it
# with the .goreleaser.yaml of the dispatched ref, uploading into the existing
# release. The tag is never moved.

on:
  workflow_dispatch:
    inputs:
      republish_tag:
        description: >-
          Recovery only: release tag (e.g. v0.4.0) whose GoReleaser job failed.
          Builds that tag with the .goreleaser.yaml of the ref this run is
          dispatched from and uploads into the existing release. Leave empty
          for a normal release.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  release-please:
    name: Release Please
    # A republish must not open or update a release PR for the fix commits.
    if: ${{ inputs.republish_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: GoReleaser
    needs: release-please
    # !cancelled(): with republish_tag set, release-please is skipped, and a job
    # whose need was skipped is skipped too unless its condition says otherwise.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.republish_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach artifacts to the release
      id-token: write # cosign keyless signing + provenance attestation
      attestations: write # provenance attestation
    steps:
      # A hand-typed tag is validated before anything is checked out.
      - name: Validate the republish tag
        if: ${{ inputs.republish_tag != '' }}
        env:
          TAG: ${{ inputs.republish_tag }}
        run: |
          set -euo pipefail
          release_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ ! "$TAG" =~ $release_tag_re ]]; then
            echo "::error::Refusing to republish: '$TAG' is not a release tag (vX.Y.Z[-rc.N])."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified for a republish, so a branch named like the tag can
          # never be built and published instead.
          ref: ${{ inputs.republish_tag != '' && format('refs/tags/{0}', inputs.republish_tag) || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use the dispatched ref's GoReleaser config for a republish
        id: config
        if: ${{ inputs.republish_tag != '' }}
        env:
          TAG: ${{ inputs.republish_tag }}
          CONFIG_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "::error::HEAD is not the commit of tag $TAG ($tag_commit)."
            exit 1
          fi
          # Outside the checkout, so the tree GoReleaser builds stays clean at the tag.
          git show "$CONFIG_REF:.goreleaser.yaml" > "$RUNNER_TEMP/goreleaser.yaml"
          echo "args=--config $RUNNER_TEMP/goreleaser.yaml" >> "$GITHUB_OUTPUT"
          echo "Building $TAG ($(git rev-parse HEAD)) with .goreleaser.yaml from $CONFIG_REF"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean ${{ steps.config.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
